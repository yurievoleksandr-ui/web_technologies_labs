<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 3 - Оформлення анкети</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="form-container">
        <h2>Анкета користувача</h2>
        
        <label for="username">ПІБ:</label>
        <input type="text" id="username" placeholder="Введіть ПІБ">

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="example@mail.com">

        <label for="city">Місто:</label>
        <select id="city">
            <option>Київ</option>
            <option>Львів</option>
            <option>Одеса</option>
        </select>

        <button type="submit">Надіслати</button>
    </form>
</body>
</html>
