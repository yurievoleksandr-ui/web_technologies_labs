<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 4 — Анкета користувача</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2 style="text-align: center;">Анкета користувача</h2>

        <!-- Форма з методом GET (для демонстрації структури запиту в URL) -->
        <form action="questionnaire.html" method="get">

            <!-- Блок 1: Особисті дані -->
            <fieldset>
                <legend>Особисті дані</legend>

                <!-- Текстове поле (ПІБ) -->
                <div class="form-group">
                    <label for="fullname">ПІБ:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Іванов Іван Іванович" required tabindex="1">
                </div>

                <!-- Поле дати -->
                <div class="form-group">
                    <label for="birthdate">Дата народження:</label>
                    <input type="date" id="birthdate" name="birthdate" required tabindex="2">
                </div>

                <!-- Поле email з регулярним виразом та вимкненим автозаповненням -->
                <div class="form-group">
                    <label for="user_email">Email:</label>
                    <input type="email" id="user_email" name="user_email" placeholder="example@mail.com" 
                           autocomplete="off" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" 
                           required tabindex="3">
                </div>

                <!-- Поле мобільного номера з pattern -->
                <div class="form-group">
                    <label for="phone">Телефон (формат +380XXXXXXXXX):</label>
                    <input type="tel" id="phone" name="phone" placeholder="+380991234567" 
                           pattern="\+380[0-9]{9}" required tabindex="4">
                </div>

                <!-- Поле пароля з вимогами валідації (6 символів, велика, мала літера, цифра) -->
                <div class="form-group">
                    <label for="user_pass">Пароль (6 символів: 1 велика, 1 мала літера, 1 цифра):</label>
                    <input type="password" id="user_pass" name="user_pass" placeholder="Password1" 
                           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6}" required tabindex="5">
                </div>
            </fieldset>

            <!-- Блок 2: Опитування та вибір -->
            <fieldset>
                <legend>Додаткова інформація</legend>

                <!-- Блок Radio 1 (3 значення) -->
                <div class="form-group">
                    <label>Рівень освіти:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="education" value="basic" tabindex="6"> Базова</label>
                        <label><input type="radio" name="education" value="bachelor" tabindex="7"> Бакалавр</label>
                        <label><input type="radio" name="education" value="master" tabindex="8"> Магістр</label>
                    </div>
                </div>

                <!-- Блок Radio 2 (3 значення, 2-е активне за замовчуванням) -->
                <div class="form-group">
                    <label>Зайнятість:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="employment" value="unemployed" tabindex="9"> Не працюю</label>
                        <label><input type="radio" name="employment" value="student" checked tabindex="10"> Студент</label>
                        <label><input type="radio" name="employment" value="employed" tabindex="11"> Працюю</label>
                    </div>
                </div>

                <!-- Блок Checkbox (4 значення) -->
                <div class="form-group">
                    <label>Інтереси (чеклист):</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="interests" value="web" tabindex="12"> Web-розробка</label>
                        <label><input type="checkbox" name="interests" value="design" tabindex="13"> Дизайн</label>
                        <label><input type="checkbox" name="interests" value="qa" tabindex="14"> Тестування</label>
                        <label><input type="checkbox" name="interests" value="ai" tabindex="15"> ШІ / AI</label>
                    </div>
                </div>

                <!-- Випадаючий список (5 значень, 3-е за замовчуванням selected) -->
                <div class="form-group">
                    <label for="experience">Досвід у IT:</label>
                    <select id="experience" name="experience" tabindex="16">
                        <option value="none">Без досвіду</option>
                        <option value="less_1">Менше 1 року</option>
                        <option value="1_2" selected>1-2 роки</option>
                        <option value="2_5">2-5 років</option>
                        <option value="more_5">Більше 5 років</option>
                    </select>
                </div>

                <!-- Multiple select (6 значень) -->
                <div class="form-group">
                    <label for="languages">Мови програмування (утримуйте Ctrl для вибору кількох):</label>
                    <select id="languages" name="languages" multiple size="4" tabindex="17">
                        <option value="html_css">HTML/CSS</option>
                        <option value="js">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="cpp">C++</option>
                        <option value="php">PHP</option>
                        <option value="java">Java</option>
                    </select>
                </div>

                <!-- Select з групуванням optgroup (4 групи по 3 значення) -->
                <div class="form-group">
                    <label for="city">Обрати місто проживання:</label>
                    <select id="city" name="city" tabindex="18">
                        <optgroup label="Північ">
                            <option value="kyiv">Київ</option>
                            <option value="chernihiv">Чернігів</option>
                            <option value="sumy">Суми</option>
                        </optgroup>
                        <optgroup label="Захід">
                            <option value="lviv">Львів</option>
                            <option value="chernivtsi">Чернівці</option>
                            <option value="if">Івано-Франківськ</option>
                        </optgroup>
                        <optgroup label="Південь">
                            <option value="odesa">Одеса</option>
                            <option value="mykolaiv">Миколаїв</option>
                            <option value="kherson">Херсон</option>
                        </optgroup>
                        <optgroup label="Схід">
                            <option value="kharkiv">Харків</option>
                            <option value="dnipro">Дніпро</option>
                            <option value="zaporizhzhia">Запоріжжя</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Список підказок (datalist) -->
                <div class="form-group">
                    <label for="ide_choice">Улюблений редактор коду:</label>
                    <input list="ide_list" id="ide_choice" name="ide_choice" placeholder="Почніть вводити..." tabindex="19">
                    <datalist id="ide_list">
                        <option value="VS Code">
                        <option value="WebStorm">
                        <option value="Sublime Text">
                        <option value="PHPStorm">
                    </datalist>
                </div>

                <!-- Текстова область (textarea) -->
                <div class="form-group">
                    <label for="about">Коротко про себе:</label>
                    <textarea id="about" name="about" rows="4" placeholder="Розкажіть про свої хобі та цілі..." tabindex="20"></textarea>
                </div>
            </fieldset>

            <!-- Блок 3: Завантаження аудіофайлів -->
            <fieldset>
                <legend>Прикріплення файлів</legend>
                <div class="form-group">
                    <label for="audio_files">Завантажити свої аудіофайли (тільки аудіо, декілька файлів):</label>
                    <input type="file" id="audio_files" name="audio_files[]" accept="audio/*" multiple tabindex="21">
                </div>
            </fieldset>

            <!-- Кнопки відправки та скидання -->
            <div class="buttons-group">
                <button type="submit" class="btn btn-submit" tabindex="22">Відправити (GET)</button>
                <button type="reset" class="btn btn-reset" tabindex="23">Очистити</button>
            </div>
        </form>

        <br>
        <div style="text-align: center;">
            <a href="/lab_3/task_1/index.html" class="back-link">Повернутись на головну</a>
        </div>
    </div>

</body>
</html>
