<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 5 — Mobile-First Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">

    <section class="demo-section">
      <h2 class="demo-title">Спосіб 1: Column Grids & Rows</h2>
      <div class="layout-grid-rows">
        <header class="block header">header</header>
        <nav class="block nav">navigation</nav>
        <main class="block main">main</main>
        <aside class="block sidebar">sidebar</aside>
        <div class="block ads">ads</div>
        <footer class="block footer">footer</footer>
      </div>
    </section>

    <section class="demo-section">
      <h2 class="demo-title">Спосіб 2: Grid Template Areas</h2>
      <div class="layout-grid-areas">
        <header class="block area-header">header</header>
        <nav class="block area-nav">navigation</nav>
        <main class="block area-main">main</main>
        <aside class="block area-sidebar">sidebar</aside>
        <div class="block area-ads">ads</div>
        <footer class="block area-footer">footer</footer>
      </div>
    </section>
  </main>

</body>
</html>
